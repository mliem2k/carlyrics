plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

kotlin {
    jvmToolchain(21)
}

// hiltJavaCompile ignores the Kotlin toolchain and falls back to the running JDK.
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}

android {
    namespace 'com.mliem.carlyrics'
    compileSdk 37  // required by the current AndroidX releases; targetSdk stays 36

    defaultConfig {
        applicationId "com.mliem.carlyrics"
        minSdk 30  // Android 11 minimum for Android Auto
        targetSdk 36
        def vcStr = project.findProperty("versionCode")?.toString()
        versionCode vcStr ? Integer.parseInt(vcStr) : 2
        versionName project.findProperty("versionName")?.toString() ?: "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        room {
            schemaDirectory "$projectDir/schemas"
        }
    }

    signingConfigs {
        release {
            // No hardcoded fallback on purpose: assembleRelease fails loudly with a
            // clear "keystore not set" error if these are missing, instead of silently
            // signing with a known password. assembleDebug never evaluates this block.
            def keystoreFile = System.getenv("SIGNING_KEYSTORE_PATH")
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android (Latest June 2026)
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'

    // Compose BOM (June 2026)
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'

    // Navigation (Latest)
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // Hilt DI (Latest)
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'

    // Room Database (Latest)
    implementation 'androidx.room:room-ktx:2.8.5'
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // DataStore (Latest)
    implementation 'androidx.datastore:datastore-preferences:1.3.0'

    // Networking (Latest)
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // JSON Serialization
    implementation 'com.google.code.gson:gson:2.15.0'

    // Media3/Media (Latest)
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'

    // Android Car App Library
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-automotive:1.7.0'

    // Glance (Home screen widget)
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'androidx.glance:glance-material3:1.2.0'

    // Coroutines (Latest)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    // Real org.json impl for JVM unit tests: android.jar's org.json classes
    // are stubs that throw RuntimeException("Stub!") on the plain JVM.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
