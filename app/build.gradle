plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

android {
    namespace 'com.mliem.carlyrics'
    compileSdk 36  // Android 15 (latest as of June 2026)

    defaultConfig {
        applicationId "com.mliem.carlyrics"
        minSdk 30  // Android 11 minimum for Android Auto
        targetSdk 36
        versionCode (project.findProperty("versionCode") as String)?.toInteger() ?: 2
        versionName project.findProperty("versionName") ?: "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        room {
            schemaDirectory "$projectDir/schemas"
        }
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("SIGNING_KEYSTORE_PATH") ?: rootProject.file("spotify_lyrics_key.jks").absolutePath
            storeFile file(keystoreFile)
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: "spotifylyrics"
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "spotify-lyrics"
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: "spotifylyrics"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android (Latest June 2026)
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Compose BOM (June 2026)
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'

    // Navigation (Latest)
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    // Hilt DI (Latest)
    implementation 'com.google.dagger:hilt-android:2.60'
    ksp 'com.google.dagger:hilt-compiler:2.60'

    // Room Database (Latest)
    implementation 'androidx.room:room-ktx:2.7.0'
    implementation 'androidx.room:room-runtime:2.7.0'
    ksp 'androidx.room:room-compiler:2.7.0'

    // DataStore (Latest)
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Networking (Latest)
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // JSON Serialization
    implementation 'com.google.code.gson:gson:2.11.0'

    // Media3/Media (Latest)
    implementation 'androidx.media3:media3-common:1.4.0'
    implementation 'androidx.media3:media3-session:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.0'

    // Android Car App Library
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-automotive:1.7.0'

    // Glance (Home screen widget)
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'

    // Coroutines (Latest)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
