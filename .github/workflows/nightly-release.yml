name: Nightly Release

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC daily
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Set version code from date
        id: version
        run: |
          DATE=$(date -u +%Y%m%d)
          COUNT=$(git rev-list --count HEAD)
          echo "versionCode=$COUNT" >> $GITHUB_OUTPUT
          echo "versionName=nightly-$DATE" >> $GITHUB_OUTPUT
          echo "tag=nightly-$DATE" >> $GITHUB_OUTPUT

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            -PversionName=${{ steps.version.outputs.versionName }}

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             carlyrics-${{ steps.version.outputs.versionName }}.apk

      - name: Delete existing nightly tag (if any)
        run: |
          git tag -d ${{ steps.version.outputs.tag }} 2>/dev/null || true
          git push origin :refs/tags/${{ steps.version.outputs.tag }} 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CarLyrics ${{ steps.version.outputs.versionName }}"
          body: |
            **Automated nightly build** — ${{ steps.version.outputs.versionName }}

            ### What's in this build
            - LRCLIB synced lyrics (timestamped, karaoke-style)
            - Android Auto / Android Automotive support
            - Home screen widget with live lyric
            - Lyrics Library: browse cached lyrics, import LRC files
            - Companion View: full-screen synced lyrics with auto-scroll
            - Live notification: shows current lyric line

            ### Install
            Download `carlyrics-*.apk` and sideload it (Settings → Install unknown apps).

            > **Minimum:** Android 11 (API 30) · Android Auto requires a compatible head unit
          files: carlyrics-${{ steps.version.outputs.versionName }}.apk
          prerelease: true
