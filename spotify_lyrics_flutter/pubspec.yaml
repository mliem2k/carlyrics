name: spotify_lyrics
description: "Spotify Lyrics for Android Auto - Display synchronized lyrics while listening to Spotify"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # HTTP client
  http: ^1.1.0
  
  # JSON
  json_annotation: ^4.8.1
  
  # Code generation
  build_runner: ^2.4.13
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/