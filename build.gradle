// Top-level build file for CarLyrics with latest versions (June 2026)

plugins {
    id 'com.android.application' version '9.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.0' apply false
    id 'com.google.dagger.hilt.android' version '2.53' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0' apply false
    id 'com.google.devtools.ksp' version '2.4.0-2.0.30' apply false
    id 'androidx.room' version '2.7.0' apply false
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
